<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List App</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f1f2f6;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    margin-top: 60px;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 30px;
    height: fit-content;
  }
  h1 {
    text-align: center;
    color: #14151a;
    font-size: 24px;
    margin: 0 0 22px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  #taskInput {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #e3e4ea;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
  }
  #taskInput:focus { border-color: #2451ff; }
  #addBtn {
    background: #2451ff;
    color: white;
    border: none;
    padding: 0 20px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  #addBtn:hover { opacity: 0.9; }
  ul#taskList {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  ul#taskList li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
    font-size: 15px;
  }
  ul#taskList li .task-text {
    flex: 1;
    cursor: pointer;
  }
  ul#taskList li.completed .task-text {
    text-decoration: line-through;
    color: #9aa1ab;
  }
  .delete-btn {
    background: none;
    border: none;
    color: #c0392b;
    font-size: 16px;
    cursor: pointer;
    padding: 0 6px;
  }
  .empty-msg {
    text-align: center;
    color: #9aa1ab;
    font-size: 14px;
    padding: 20px 0;
  }
</style>
</head>
<body>

<div class="app">
  <h1>My To-Do List</h1>

  <div class="input-row">
    <input type="text" id="taskInput" placeholder="Write a new task...">
    <button id="addBtn">Add</button>
  </div>

  <ul id="taskList"></ul>
</div>

<script>
  // On page load, get any previously saved tasks from localStorage.
  // If nothing is saved yet, start with an empty array.
  let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

  const taskInput = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const taskList = document.getElementById('taskList');

  // This function draws (renders) the current task list on the screen.
  // It runs every time the tasks array changes.
  function renderTasks() {
    taskList.innerHTML = ''; // clear the list first

    if (tasks.length === 0) {
      taskList.innerHTML = '<p class="empty-msg">No tasks yet. Add one above.</p>';
      return;
    }

    tasks.forEach((task, index) => {
      const li = document.createElement('li');
      if (task.completed) li.classList.add('completed');

      li.innerHTML = `
        <span class="task-text">${task.text}</span>
        <button class="delete-btn">✕</button>
      `;

      // Clicking the task text toggles it between completed / not completed
      li.querySelector('.task-text').addEventListener('click', () => {
        tasks[index].completed = !tasks[index].completed;
        saveAndRender();
      });

      // Clicking the delete button removes that task from the array
      li.querySelector('.delete-btn').addEventListener('click', () => {
        tasks.splice(index, 1);
        saveAndRender();
      });

      taskList.appendChild(li);
    });
  }

  // Saves the current tasks array to localStorage, then re-renders the list.
  // This is what makes tasks survive a page refresh.
  function saveAndRender() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
    renderTasks();
  }

  // Adds a new task from whatever is typed in the input box.
  function addTask() {
    const text = taskInput.value.trim();
    if (text === '') return; // don't add empty tasks

    tasks.push({ text: text, completed: false });
    taskInput.value = '';
    saveAndRender();
  }

  // Add task when the button is clicked
  addBtn.addEventListener('click', addTask);

  // Add task when Enter is pressed inside the input box
  taskInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') addTask();
  });

  // Render whatever tasks were already saved, as soon as the page loads
  renderTasks();
</script>

</body>
</html>
